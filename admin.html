<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta n
ame="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>BATUMI VIP ADMIN</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
-webkit-tap-highlight-color:transparent;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
background:#020817;
color:#fff;
}

/* TOPBAR */

.topbar{
height:70px;
background:linear-gradient(90deg,#001540,#0038a8,#001540);
display:flex;
align-items:center;
justify-content:space-between;
padding:0 18px;
border-bottom:1px solid rgba(255,255,255,.08);
}

.logo{
font-size:24px;
font-weight:900;
}

.admin-badge{
background:#ffd000;
color:#000;
padding:8px 16px;
border-radius:30px;
font-size:12px;
font-weight:900;
}

/* APP */

.app{
width:100%;
height:calc(100% - 70px);
display:flex;
overflow:hidden;
}

/* USER LIST */

.user-list{
width:100%;
height:100%;
overflow-y:auto;
background:#061120;
}

.user-row{
display:flex;
align-items:center;
gap:12px;
padding:14px;
border-bottom:1px solid rgba(255,255,255,.05);
cursor:pointer;
position:relative;
}

.user-row.active{
background:#07204a;
border-left:4px solid #ffd000;
}

.avatar{
width:56px;
height:56px;
border-radius:18px;
background:linear-gradient(135deg,#0038a8,#001540);
display:flex;
align-items:center;
justify-content:center;
font-size:22px;
font-weight:900;
flex-shrink:0;
}

.user-info{
flex:1;
min-width:0;
}

.user-name{
font-size:16px;
font-weight:800;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.user-preview{
font-size:13px;
color:#8ea3b7;
margin-top:4px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.unread{
min-width:24px;
height:24px;
padding:0 7px;
border-radius:20px;
background:#ff3b30;
display:none;
align-items:center;
justify-content:center;
font-size:11px;
font-weight:900;
}

.unread.show{
display:flex;
}

/* CHAT PAGE */

.chat-page{
position:fixed;
top:0;
left:100%;
width:100%;
height:100%;
background:#020817;
z-index:100;
display:flex;
flex-direction:column;
transition:.25s;
}

.chat-page.show{
left:0;
}

/* CHAT HEADER */

.chat-header{
height:74px;
background:linear-gradient(90deg,#001540,#0038a8,#001540);
display:flex;
align-items:center;
gap:12px;
padding:0 14px;
border-bottom:1px solid rgba(255,255,255,.08);
flex-shrink:0;
}

.back-btn{
width:42px;
height:42px;
border:none;
border-radius:14px;
background:rgba(255,255,255,.12);
color:#fff;
font-size:24px;
cursor:pointer;
flex-shrink:0;
}

.chat-avatar{
width:52px;
height:52px;
border-radius:18px;
background:#ffd000;
color:#000;
display:flex;
align-items:center;
justify-content:center;
font-size:22px;
font-weight:900;
flex-shrink:0;
}

.chat-user{
font-size:17px;
font-weight:900;
}

.chat-phone{
font-size:12px;
margin-top:2px;
color:#ddd;
}

.typing{
font-size:12px;
color:#00ff88;
margin-top:2px;
display:none;
}

/* MESSAGES */

.messages{
flex:1;
overflow-y:auto;
padding:16px;
display:flex;
flex-direction:column;
gap:14px;
}

.msg{
max-width:78%;
padding:12px 14px;
border-radius:22px;
position:relative;
word-break:break-word;
line-height:1.4;
font-size:15px;
}

.msg.customer{
align-self:flex-start;
background:linear-gradient(135deg,#1e293b,#162031);
border-bottom-left-radius:8px;
}

.msg.admin{
align-self:flex-end;
background:linear-gradient(135deg,#ffd000,#ffb300);
color:#000;
border-bottom-right-radius:8px;
}

.msg img{
width:100%;
max-width:220px;
max-height:300px;
object-fit:cover;
border-radius:16px;
display:block;
}

.msg-time{
margin-top:7px;
font-size:11px;
opacity:.7;
text-align:right;
}

.seen{
margin-top:4px;
font-size:11px;
text-align:right;
opacity:.7;
}

.delete-btn{
position:absolute;
top:-8px;
right:-8px;
width:24px;
height:24px;
border:none;
border-radius:50%;
background:#ff3b30;
color:#fff;
font-size:12px;
font-weight:900;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
}

/* INPUT */

.input-area{
padding:14px;
display:flex;
gap:10px;
background:#0b1220;
border-top:1px solid rgba(255,255,255,.05);
}

.input-btn{
width:54px;
height:54px;
border:none;
border-radius:18px;
cursor:pointer;
font-size:22px;
font-weight:900;
flex-shrink:0;
}

.image-btn{
background:#1e293b;
color:#fff;
}

.send-btn{
background:linear-gradient(135deg,#ffd000,#ffb300);
color:#000;
}

.message-input{
flex:1;
height:54px;
border:none;
outline:none;
background:#1e293b;
border-radius:18px;
padding:0 16px;
font-size:15px;
color:#fff;
}

</style>
</head>

<body>

<div class="topbar">

<div class="logo">
⚡ Admin Panel
</div>

<div class="admin-badge">
ADMIN
</div>

</div>

<div class="app">

<div class="user-list" id="userList"></div>

</div>

<div class="chat-page" id="chatPage">

<div class="chat-header">

<button class="back-btn" id="backBtn">
‹
</button>

<div class="chat-avatar" id="chatAvatar">
?
</div>

<div>

<div class="chat-user" id="chatUser">
User
</div>

<div class="chat-phone" id="chatPhone">
Phone
</div>

<div class="typing" id="typingText">
Yazır...
</div>

</div>

</div>

<div class="messages" id="messages"></div>

<div class="input-area">

<input
type="file"
id="imageInput"
accept="image/*"
hidden
>

<button class="input-btn image-btn" id="imageBtn">
🖼️
</button>

<input
type="text"
id="messageInput"
class="message-input"
placeholder="Mesaj yaz..."
>

<button class="input-btn send-btn" id="sendBtn">
➜
</button>

</div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getDatabase,
ref,
push,
onValue,
onChildAdded,
update,
set,
remove
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

/* FIREBASE */

const firebaseConfig = {

apiKey:"AIzaSyBmtDa9fkBjd-J2tToJF_8CcPVZs3pJZsM",

authDomain:"batumi-kazino-5a748.firebaseapp.com",

databaseURL:"https://batumi-kazino-5a748-default-rtdb.firebaseio.com",

projectId:"batumi-kazino-5a748",

storageBucket:"batumi-kazino-5a748.firebasestorage.app",

messagingSenderId:"501153230995",

appId:"1:501153230995:web:8dac82ebf1904fc1881d66"

};

const app = initializeApp(firebaseConfig);

const db = getDatabase(app);

/* DOM */

const userList = document.getElementById("userList");
const chatPage = document.getElementById("chatPage");
const backBtn = document.getElementById("backBtn");
const chatAvatar = document.getElementById("chatAvatar");
const chatUser = document.getElementById("chatUser");
const chatPhone = document.getElementById("chatPhone");
const messages = document.getElementById("messages");
const imageBtn = document.getElementById("imageBtn");
const imageInput = document.getElementById("imageInput");
const messageInput = document.getElementById("messageInput");
const sendBtn = document.getElementById("sendBtn");
const typingText = document.getElementById("typingText");

/* STATE */

let activeUser = null;
const unreadMap = {};
const userCache = {};

/* HELPERS */

function esc(text){

return String(text || "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;");

}

function timeFormat(ts){

return new Date(ts).toLocaleTimeString("az-AZ",{
hour:"2-digit",
minute:"2-digit"
});

}

function setUnread(userId,count){

unreadMap[userId] = count;

const badge =
document.getElementById("badge_"+userId);

if(!badge) return;

badge.textContent =
count > 9 ? "9+" : count;

if(count > 0){

badge.classList.add("show");

}else{

badge.classList.remove("show");

}

}

/* OPEN CHAT */

function openChat(userId){

activeUser = userId;

chatPage.classList.add("show");

setUnread(userId,0);

const user = userCache[userId];

chatAvatar.textContent =
(user.username || "?")[0].toUpperCase();

chatUser.textContent =
user.username || "";

chatPhone.textContent =
user.phone || "";

const msgRef =
ref(db,"messages/"+userId);

onValue(msgRef,(snap)=>{

messages.innerHTML = "";

if(!snap.exists()) return;

const arr = [];

snap.forEach(child=>{

const data = child.val();

if(data.sender === "customer" && !data.seen){

update(
ref(db,"messages/"+userId+"/"+child.key),
{
seen:true
}
);

}

arr.push({
key:child.key,
data:data
});

});

arr.sort((a,b)=>
(a.data.timestamp||0)-
(b.data.timestamp||0)
);

arr.forEach(item=>{

renderMessage(item.data,item.key);

});

});

const typingRef =
ref(db,"typing/"+userId);

onValue(typingRef,(snap)=>{

if(snap.val()){

typingText.style.display = "block";

}else{

typingText.style.display = "none";

}

});

}

/* RENDER MESSAGE */

function renderMessage(data,key){

const div = document.createElement("div");

div.className =
"msg " +
(data.sender === "admin"
? "admin"
: "customer");

let html = "";

if(data.image){

html =
`<img src="${data.image}">`;

}else{

html = esc(data.text);

}

div.innerHTML = `

${html}

<div class="msg-time">
${timeFormat(data.timestamp)}
</div>

${data.sender === "admin"
? `<div class="seen">
${data.seen ? "Oxundu ✓✓" : "Göndərildi ✓"}
</div>`
: ""}

<button class="delete-btn">
✕
</button>

`;

div.querySelector(".delete-btn").onclick =
async ()=>{

const ok =
confirm("Mesaj silinsin?");

if(!ok) return;

await remove(
ref(
db,
"messages/"+activeUser+"/"+key
)
);

};

messages.appendChild(div);

messages.scrollTop =
messages.scrollHeight;

}

/* USERS */

const usersRef = ref(db,"users");

onChildAdded(usersRef,(snap)=>{

const data = snap.val();

if(!data) return;

const userId =
data.customerId || snap.key;

userCache[userId] = data;

const row =
document.createElement("div");

row.className = "user-row";

row.innerHTML = `

<div class="avatar">
${(data.username || "?")[0].toUpperCase()}
</div>

<div class="user-info">

<div class="user-name">
${esc(data.username || "Unknown")}
</div>

<div class="user-preview"
id="preview_${userId}">
Mesaj yoxdur
</div>

</div>

<div class="unread"
id="badge_${userId}">
0
</div>

`;

row.onclick =
()=> openChat(userId);

userList.appendChild(row);

const msgRef =
ref(db,"messages/"+userId);

let loaded = false;

onChildAdded(msgRef,(msgSnap)=>{

const msg = msgSnap.val();

if(!msg) return;

const preview =
msg.text || "📷 Şəkil";

const previewEl =
document.getElementById(
"preview_"+userId
);

if(previewEl){

previewEl.textContent =
preview;

}

if(!loaded) return;

if(
msg.sender === "customer"
&& activeUser !== userId
){

setUnread(
userId,
(unreadMap[userId] || 0)+1
);

}

});

setTimeout(()=>{

loaded = true;

},1000);

});

/* SEND MESSAGE */

function sendMessage(){

const text =
messageInput.value.trim();

if(!text || !activeUser) return;

push(
ref(db,"messages/"+activeUser),
{
sender:"admin",
text:text,
timestamp:Date.now(),
seen:false
}
);

messageInput.value = "";

}

sendBtn.onclick = sendMessage;

messageInput.addEventListener(
"keydown",
e=>{

if(e.key === "Enter"){

sendMessage();

}

}
);

/* TYPING */

let typingTimer;

messageInput.addEventListener(
"input",
()=>{

if(!activeUser) return;

set(
ref(db,"typing-admin/"+activeUser),
true
);

clearTimeout(typingTimer);

typingTimer = setTimeout(()=>{

set(
ref(db,"typing-admin/"+activeUser),
false
);

},1000);

}
);

/* IMAGE */

imageBtn.onclick = ()=>{

if(!activeUser) return;

imageInput.click();

};

imageInput.onchange = e=>{

const file = e.target.files[0];

if(!file) return;

const reader = new FileReader();

reader.onload = ()=>{

push(
ref(db,"messages/"+activeUser),
{
sender:"admin",
image:reader.result,
timestamp:Date.now(),
seen:false
}
);

};

reader.readAsDataURL(file);

};

/* BACK */

backBtn.onclick = ()=>{

chatPage.classList.remove("show");

};

</script>

</body>
</html>
