<!DOCTYPE html>
<html lang="az">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>BATUMI ADMIN</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

  background:#08131d;

  color:white;

  overflow-y:auto;
  overflow-x:hidden;
}

/* TOPBAR */
html{
  height:100%;
  overflow-y:auto;
}
.topbar{

height:95px;

background:#162635;

display:flex;

align-items:center;

justify-content:space-between;

padding:0 22px;
}

.logo{

font-size:30px;

font-weight:900;

color:#FFD700;
}

.bell{

font-size:42px;
}

/* SEARCH */

.search{

padding:16px;
}

.search input{

width:100%;

height:60px;

border:none;

outline:none;

border-radius:20px;

background:#1f3344;

color:white;

padding:0 18px;

font-size:17px;
}

/* USERS */

.users{

  min-height:calc(100vh - 175px);

  overflow-y:auto;

  padding-bottom:120px;
}

.user{

display:flex;

align-items:center;

gap:14px;

padding:18px;

border-bottom:
1px solid rgba(255,255,255,.05);

cursor:pointer;
}

.user:hover{

background:#11202c;
}

.avatar{

width:70px;
height:70px;

border-radius:50%;

object-fit:cover;
}

.user-info{

flex:1;
}

.user-top{

display:flex;

justify-content:space-between;
}

.name{

font-size:21px;

font-weight:900;
}

.time{

font-size:14px;

color:#9ca8b3;
}

.phone{

margin-top:5px;

font-size:15px;

color:#9ca8b3;
}

.last{

margin-top:7px;

font-size:17px;
}

.unread{

min-width:34px;

height:34px;

padding:0 10px;

border-radius:30px;

background:#00d2a0;

display:flex;

align-items:center;

justify-content:center;

font-size:15px;

font-weight:900;
}

/* CHAT */

.chat-overlay{

position:fixed;

inset:0;

background:
rgba(0,0,0,.8);

display:none;

justify-content:center;

align-items:center;

padding:10px;

z-index:9999;
}

.chat-box{

width:100%;

max-width:470px;

height:92vh;

background:#0c141c;

border-radius:30px;

overflow:hidden;

display:flex;

flex-direction:column;
}

/* TOP */

.chat-top{

height:90px;

background:#162635;

display:flex;

align-items:center;

justify-content:space-between;

padding:0 16px;
}

.chat-user{

display:flex;

align-items:center;

gap:12px;
}

.chat-user img{

width:58px;
height:58px;

border-radius:50%;
}

.chat-user h2{

font-size:24px;

color:#FFD700;
}

.chat-user p{

margin-top:5px;

font-size:14px;

color:#d6d6d6;
}

.close{

width:55px;
height:55px;

border:none;

border-radius:50%;

background:#FFD700;

color:black;

font-size:34px;

font-weight:900;
}

/* MESSAGES */

.messages{

flex:1;

overflow-y:auto;

padding:18px;

display:flex;

flex-direction:column;

gap:14px;

background:
linear-gradient(
rgba(0,0,0,.82),
rgba(0,0,0,.88)
),

url("https://images.unsplash.com/photo-1511512578047-dfb367046420?q=80&w=1200");

background-size:cover;
background-position:center;
}

.message{

position:relative;

max-width:78%;

padding:14px;

border-radius:22px;

font-size:17px;

line-height:1.5;

word-wrap:break-word;
}

.user-message{

align-self:flex-start;

background:#2c3d4b;

color:white;
}

.admin-message{

align-self:flex-end;

background:#00c896;

color:white;

font-weight:700;
}

/* IMAGE */

.chat-image{

width:100%;

max-width:240px;

border-radius:18px;

display:block;
}

/* DELETE */

.delete{

position:absolute;

top:-10px;
right:-10px;

width:30px;
height:30px;

border:none;

border-radius:50%;

background:red;

color:white;

font-size:16px;

font-weight:900;
}

/* INPUT */

.bottom{

min-height:92px;

background:#162635;

display:flex;

align-items:center;

gap:10px;

padding:14px;
}

.image-btn{

width:60px;
height:60px;

border:none;

border-radius:18px;

background:#00c896;

color:white;

font-size:38px;

font-weight:900;

flex-shrink:0;
}

.bottom input[type="text"]{

flex:1;

height:60px;

border:none;

outline:none;

border-radius:18px;

background:#2b3945;

color:white;

padding:0 16px;

font-size:17px;

min-width:0;
}

.send{

width:80px;
height:60px;

border:none;

border-radius:18px;

background:#00c896;

color:white;

font-size:18px;

font-weight:900;

flex-shrink:0;
}

</style>

</head>

<body>

<!-- TOPBAR -->

<div class="topbar">

<div class="logo">
BATUMI ADMIN
</div>

<div class="bell">
🔔
</div>

</div>

<!-- SEARCH -->

<div class="search">

<input
type="text"
id="searchInput"
placeholder="Müştəri axtar..."
>

</div>

<!-- USERS -->

<div
class="users"
id="usersList"
></div>

<!-- CHAT -->

<div
class="chat-overlay"
id="chatOverlay"
>

<div class="chat-box">

<!-- TOP -->

<div class="chat-top">

<div class="chat-user">

<img
id="chatAvatar"
src=""
>

<div>

<h2 id="chatName"></h2>

<p id="chatPhone"></p>

</div>

</div>

<button
class="close"
id="closeBtn"
>
×
</button>

</div>

<!-- MESSAGES -->

<div
class="messages"
id="messages"
></div>

<!-- INPUT -->

<div class="bottom">

<input
type="file"
id="imageInput"
accept="image/*"
hidden
>

<button
class="image-btn"
id="imageBtn"
>
+
</button>

<input
type="text"
id="messageInput"
placeholder="Mesaj yaz..."
>

<button
class="send"
id="sendBtn"
>
Göndər
</button>

</div>

</div>

</div>

<!-- FIREBASE -->

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {

getDatabase,
ref,
push,
onValue,
update,
remove

}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

/* FIREBASE */

const firebaseConfig = {

apiKey:
"AIzaSyBmtDa9fkBjd-J2tToJF_8CcPVZs3pJZsM",

authDomain:
"batumi-kazino-5a748.firebaseapp.com",

databaseURL:
"https://batumi-kazino-5a748-default-rtdb.firebaseio.com",

projectId:
"batumi-kazino-5a748",

storageBucket:
"batumi-kazino-5a748.appspot.com",

messagingSenderId:
"501153230995",

appId:
"1:501153230995:web:8dac82ebf1904fc1881d66"

};

const app =
initializeApp(firebaseConfig);

const db =
getDatabase(app);

/* ELEMENTS */

const usersList =
document.getElementById("usersList");

const searchInput =
document.getElementById("searchInput");

const chatOverlay =
document.getElementById("chatOverlay");

const closeBtn =
document.getElementById("closeBtn");

const messagesDiv =
document.getElementById("messages");

const sendBtn =
document.getElementById("sendBtn");

const messageInput =
document.getElementById("messageInput");

const chatName =
document.getElementById("chatName");

const chatPhone =
document.getElementById("chatPhone");

const chatAvatar =
document.getElementById("chatAvatar");

const imageBtn =
document.getElementById("imageBtn");

const imageInput =
document.getElementById("imageInput");

/* VARIABLES */

let allMessages = [];

let selectedPhone = null;

/* REALTIME */

onValue(
ref(db,"messages"),
(snapshot)=>{

const data =
snapshot.val();

if(!data){

usersList.innerHTML = "";

return;
}

allMessages =
Object.entries(data)
.map(([id,msg])=>({

id,
...msg

}));

renderUsers();

if(selectedPhone){

openChat(selectedPhone);

}

}
);

/* USERS */

function renderUsers(){

usersList.innerHTML = "";

const grouped = {};

allMessages.forEach((msg)=>{

if(
!msg.username
||
!msg.phone
){
return;
}

if(!grouped[msg.phone]){

grouped[msg.phone] = [];

}

grouped[msg.phone]
.push(msg);

});

Object.keys(grouped)
.forEach((phone)=>{

const userMessages =
grouped[phone]
.sort((a,b)=>a.time-b.time);

const last =
userMessages[
userMessages.length - 1
];

const search =
searchInput.value
.toLowerCase();

if(

!last.username
.toLowerCase()
.includes(search)

&&

!phone.includes(search)

){
return;
}

const unreadCount =
userMessages.filter(
m=>

m.sender === "user"
&&

!m.readByAdmin

).length;

usersList.innerHTML += `

<div
class="user"
onclick="openChat('${phone}')"
>

<img
class="avatar"
src="
https://i.pravatar.cc/150?u=${phone}
"
>

<div class="user-info">

<div class="user-top">

<div class="name">
${last.username}
</div>

<div class="time">

${
new Date(last.time)
.toLocaleTimeString()
.slice(0,5)
}

</div>

</div>

<div class="phone">
${phone}
</div>

<div class="last">

${
last.image
?
"📷 Şəkil"
:
(last.text || "")
}

</div>

</div>

${
unreadCount > 0
?

`
<div class="unread">
${unreadCount}
</div>
`

:

""
}

</div>

`;

});

}

/* OPEN CHAT */

window.openChat =
function(phone){

selectedPhone = phone;

chatOverlay.style.display =
"flex";

const userMessages =
allMessages.filter(
m=>m.phone === phone
)
.sort((a,b)=>a.time-b.time);

const last =
userMessages[
userMessages.length - 1
];

chatName.innerText =
last.username;

chatPhone.innerText =
phone;

chatAvatar.src =
"https://i.pravatar.cc/150?u="
+ phone;

messagesDiv.innerHTML = "";

userMessages.forEach((msg)=>{

let content = "";

/* IMAGE */

if(msg.image){

content = `

<img
src="${msg.image}"
class="chat-image"
>

`;

}

/* TEXT */

else{

content =
msg.text || "";

}

messagesDiv.innerHTML += `

<div class="
message
${
msg.sender === "admin"
?
"admin-message"
:
"user-message"
}
">

${content}

<button
class="delete"
onclick="
deleteMessage('${msg.id}')
"
>
×
</button>

</div>

`;

});

/* READ */

userMessages.forEach((msg)=>{

if(
msg.sender === "user"
&&
!msg.readByAdmin
){

update(
ref(db,"messages/" + msg.id),
{

readByAdmin:true

}
);

}

});

messagesDiv.scrollTop =
messagesDiv.scrollHeight;

};

/* CLOSE */

closeBtn.onclick = ()=>{

chatOverlay.style.display =
"none";

};

/* SEND TEXT */

async function sendMessage(){

const text =
messageInput.value.trim();

if(
text === ""
||
selectedPhone === null
){
return;
}

const userMessages =
allMessages.filter(
m=>m.phone === selectedPhone
);

const last =
userMessages[
userMessages.length - 1
];

await push(
ref(db,"messages"),
{

username:
last.username,

phone:
selectedPhone,

sender:"admin",

text:text,

time:Date.now(),

readByAdmin:true

}
);

messageInput.value = "";

}

/* SEND IMAGE */

imageBtn.onclick = ()=>{

imageInput.click();

};

imageInput.addEventListener(
"change",
function(){

const file =
imageInput.files[0];

if(
!file
||
selectedPhone === null
){
return;
}

const reader =
new FileReader();

reader.onload =
async function(){

const userMessages =
allMessages.filter(
m=>m.phone === selectedPhone
);

const last =
userMessages[
userMessages.length - 1
];

await push(
ref(db,"messages"),
{

username:
last.username,

phone:
selectedPhone,

sender:"admin",

image:reader.result,

time:Date.now(),

readByAdmin:true

}
);

};

reader.readAsDataURL(file);

}
);

/* DELETE */

window.deleteMessage =
async function(id){

const ok =
confirm("Mesaj silinsin?");

if(!ok){
return;
}

await remove(
ref(db,"messages/" + id)
);

};

/* SEND */

sendBtn.onclick =
sendMessage;

/* ENTER */

messageInput.addEventListener(
"keypress",
(e)=>{

if(e.key === "Enter"){

sendMessage();

}

}
);

/* SEARCH */

searchInput.oninput =
renderUsers;

</script>

</body>
</html>
