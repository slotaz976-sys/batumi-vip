<!DOCTYPE html>
<html lang="az">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BATUMI ADMIN</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{

  background:#08131d;

  color:white;

  overflow:hidden;
}

/* TOPBAR */

.topbar{

  height:95px;

  background:#1b2b38;

  display:flex;

  align-items:center;

  justify-content:space-between;

  padding:0 24px;
}

.logo{

  color:#FFD700;

  font-size:30px;

  font-weight:900;
}

.bell{

  font-size:52px;
}

/* SEARCH */

.search{

  padding:18px;
}

.search input{

  width:100%;

  height:62px;

  border:none;

  outline:none;

  border-radius:22px;

  background:#1b2b38;

  color:white;

  padding:0 22px;

  font-size:18px;
}

/* USERS */

.users{

  height:calc(100vh - 175px);

  overflow-y:auto;
}

.user{

  display:flex;

  align-items:center;

  gap:14px;

  padding:18px;

  border-bottom:
  1px solid rgba(255,255,255,0.05);

  position:relative;

  cursor:pointer;
}

.user:hover{

  background:#13202a;
}

.avatar{

  width:72px;
  height:72px;

  border-radius:50%;

  object-fit:cover;
}

.user-info{

  flex:1;
}

.user-top{

  display:flex;

  justify-content:space-between;
}

.name{

  font-size:21px;

  font-weight:900;
}

.time{

  color:#9aa8b5;

  font-size:14px;
}

.phone{

  margin-top:5px;

  color:#9aa8b5;

  font-size:16px;
}

.last{

  margin-top:6px;

  font-size:18px;
}

/* UNREAD */

.unread{

  position:absolute;

  right:20px;
  bottom:22px;

  min-width:34px;
  height:34px;

  border-radius:50px;

  background:#00c896;

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:16px;

  font-weight:900;
}

/* CHAT */

.chat-overlay{

  position:fixed;

  inset:0;

  background:#000000d9;

  z-index:9999;

  display:none;

  justify-content:center;

  align-items:center;

  padding:10px;
}

.chat-box{

  width:100%;
  max-width:470px;

  height:88vh;

  background:#0b141a;

  border-radius:30px;

  overflow:hidden;

  display:flex;

  flex-direction:column;
}

/* CHAT TOP */

.chat-top{

  height:90px;

  background:#1b2b38;

  display:flex;

  align-items:center;

  justify-content:space-between;

  padding:0 15px;
}

.chat-user{

  display:flex;

  align-items:center;

  gap:12px;
}

.chat-user img{

  width:58px;
  height:58px;

  border-radius:50%;
}

.chat-user h2{

  font-size:24px;
}

.chat-user p{

  margin-top:5px;

  color:#cfcfcf;

  font-size:15px;
}

.close{

  width:52px;
  height:52px;

  border:none;

  border-radius:50%;

  background:#FFD700;

  color:black;

  font-size:32px;

  font-weight:900;
}

/* MESSAGES */

.messages{

  flex:1;

  overflow-y:auto;

  padding:18px;

  display:flex;

  flex-direction:column;

  gap:14px;

  background:
  linear-gradient(rgba(0,0,0,0.88),rgba(0,0,0,0.92)),
  url("https://images.unsplash.com/photo-1511512578047-dfb367046420?q=80&w=1200");

  background-size:cover;
}

.message{

  max-width:75%;

  padding:15px;

  border-radius:20px;

  font-size:18px;

  line-height:1.5;

  word-wrap:break-word;
}

/* USER MESSAGE = SOLDA */

.user-message{

  align-self:flex-start;

  background:#2b3945;

  color:white;
}

/* ADMIN MESSAGE = SAGDA */

.admin-message{

  align-self:flex-end;

  background:#00c896;

  color:white;

  font-weight:700;
}

/* INPUT */

.bottom{

  height:88px;

  background:#1b2b38;

  display:flex;

  align-items:center;

  gap:10px;

  padding:0 14px;
}

.bottom input{

  flex:1;

  height:56px;

  border:none;

  outline:none;

  border-radius:16px;

  background:#2b3945;

  color:white;

  padding:0 16px;

  font-size:17px;
}

.bottom button{

  width:120px;

  height:56px;

  border:none;

  border-radius:16px;

  background:#00c896;

  color:white;

  font-size:19px;

  font-weight:900;
}

</style>

</head>

<body>

<!-- TOPBAR -->

<div class="topbar">

  <div class="logo">
    BATUMI ADMIN
  </div>

  <div class="bell">
    🔔
  </div>

</div>

<!-- SEARCH -->

<div class="search">

  <input
    type="text"
    id="searchInput"
    placeholder="Müştəri axtar..."
  >

</div>

<!-- USERS -->

<div
class="users"
id="usersList"
></div>

<!-- CHAT -->

<div
class="chat-overlay"
id="chatOverlay"
>

<div class="chat-box">

  <div class="chat-top">

    <div class="chat-user">

      <img
      id="chatAvatar"
      src=""
      >

      <div>

        <h2 id="chatName"></h2>

        <p id="chatPhone"></p>

      </div>

    </div>

    <button
    class="close"
    id="closeBtn"
    >
      ×
    </button>

  </div>

  <div
  class="messages"
  id="messages"
  ></div>

  <div class="bottom">

    <input
      type="text"
      id="messageInput"
      placeholder="Mesaj yaz..."
    >

    <button
    id="sendBtn"
    >
      Göndər
    </button>

  </div>

</div>

</div>

<!-- FIREBASE -->

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getDatabase,
  ref,
  push,
  onValue,
  update
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

/* FIREBASE */

const firebaseConfig = {

  apiKey:"AIzaSyBmtDa9fkBjd-J2tToJF_8CcPVZs3pJZsM",

  authDomain:
  "batumi-kazino-5a748.firebaseapp.com",

  databaseURL:
  "https://batumi-kazino-5a748-default-rtdb.firebaseio.com",

  projectId:
  "batumi-kazino-5a748",

  storageBucket:
  "batumi-kazino-5a748.appspot.com",

  messagingSenderId:
  "501153230995",

  appId:
  "1:501153230995:web:8dac82ebf1904fc1881d66"

};

const app =
initializeApp(firebaseConfig);

const db =
getDatabase(app);

/* ELEMENTS */

const usersList =
document.getElementById("usersList");

const searchInput =
document.getElementById("searchInput");

const chatOverlay =
document.getElementById("chatOverlay");

const closeBtn =
document.getElementById("closeBtn");

const messagesDiv =
document.getElementById("messages");

const sendBtn =
document.getElementById("sendBtn");

const messageInput =
document.getElementById("messageInput");

const chatName =
document.getElementById("chatName");

const chatPhone =
document.getElementById("chatPhone");

const chatAvatar =
document.getElementById("chatAvatar");

/* VARIABLES */

let allMessages = [];

let selectedPhone = null;

/* REALTIME */

onValue(
  ref(db,"messages"),
  (snapshot)=>{

    const data =
    snapshot.val();

    if(!data){

      usersList.innerHTML = "";

      return;
    }

    allMessages =
    Object.entries(data)
    .map(([id,msg])=>({

      id,
      ...msg

    }));

    renderUsers();

    if(selectedPhone){

      openChat(selectedPhone);

    }

  }
);

/* USERS */

function renderUsers(){

  usersList.innerHTML = "";

  const grouped = {};

  allMessages.forEach((msg)=>{

    /* SADECE QEYDIYYATLI */

    if(
      !msg.username
      ||
      !msg.phone
    ){
      return;
    }

    if(
      !msg.phone.startsWith("+994")
    ){
      return;
    }

    if(!grouped[msg.phone]){

      grouped[msg.phone] = [];

    }

    grouped[msg.phone]
    .push(msg);

  });

  Object.keys(grouped)
  .forEach((phone)=>{

    const userMessages =
    grouped[phone]
    .sort((a,b)=>a.time-b.time);

    const last =
    userMessages[
      userMessages.length - 1
    ];

    /* SEARCH */

    const search =
    searchInput.value
    .toLowerCase();

    if(

      !last.username
      .toLowerCase()
      .includes(search)

      &&

      !phone.includes(search)

    ){
      return;
    }

    /* UNREAD */

    const unreadCount =
    userMessages.filter(
      m=>

      m.sender === "user"
      &&

      !m.readByAdmin

    ).length;

    usersList.innerHTML += `

    <div
    class="user"
    onclick="openChat('${phone}')"
    >

      <img
      class="avatar"
      src="
      https://i.pravatar.cc/150?u=${phone}
      "
      >

      <div class="user-info">

        <div class="user-top">

          <div class="name">
            ${last.username}
          </div>

          <div class="time">

            ${
              new Date(last.time)
              .toLocaleTimeString()
              .slice(0,5)
            }

          </div>

        </div>

        <div class="phone">
          ${phone}
        </div>

        <div class="last">
          ${last.text}
        </div>

      </div>

      ${
        unreadCount > 0
        ?

        `
        <div class="unread">
          ${unreadCount}
        </div>
        `

        :

        ""

      }

    </div>

    `;

  });

}

/* OPEN CHAT */

window.openChat =
function(phone){

  selectedPhone = phone;

  chatOverlay.style.display =
  "flex";

  const userMessages =
  allMessages.filter(
    m=>m.phone === phone
  )
  .sort((a,b)=>a.time-b.time);

  const last =
  userMessages[
    userMessages.length - 1
  ];

  chatName.innerText =
  last.username;

  chatPhone.innerText =
  phone;

  chatAvatar.src =
  "https://i.pravatar.cc/150?u="
  + phone;

  messagesDiv.innerHTML = "";

  userMessages.forEach((msg)=>{

    messagesDiv.innerHTML += `

    <div class="
      message
      ${
        msg.sender === "admin"
        ?

        "admin-message"

        :

        "user-message"
      }
    ">

      ${msg.text}

    </div>

    `;

  });

  messagesDiv.scrollTop =
  messagesDiv.scrollHeight;

  /* READ */

  userMessages.forEach((msg)=>{

    if(
      msg.sender === "user"
      &&
      !msg.readByAdmin
    ){

      update(
        ref(db,"messages/" + msg.id),
        {

          readByAdmin:true

        }
      );

    }

  });

};

/* CLOSE */

closeBtn.onclick = ()=>{

  chatOverlay.style.display =
  "none";

};

/* SEND */

async function sendMessage(){

  const text =
  messageInput.value.trim();

  if(
    text === ""
    ||
    selectedPhone === null
  ){
    return;
  }

  const userMessages =
  allMessages.filter(
    m=>m.phone === selectedPhone
  );

  const last =
  userMessages[
    userMessages.length - 1
  ];

  await push(
    ref(db,"messages"),
    {

      username:
      last.username,

      phone:
      selectedPhone,

      sender:"admin",

      text:text,

      time:Date.now(),

      readByAdmin:true

    }
  );

  messageInput.value = "";

}

sendBtn.onclick =
sendMessage;

/* ENTER */

messageInput.addEventListener(
  "keypress",
  (e)=>{

    if(e.key === "Enter"){

      sendMessage();

    }

  }
);

/* SEARCH */

searchInput.oninput =
renderUsers;

</script>

</body>

</html>
