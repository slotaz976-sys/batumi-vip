<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta
name="viewport"
content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

<title>BATUMI VIP ADMIN</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
-webkit-tap-highlight-color:transparent;
}

html,
body{

width:100vw;
height:100dvh;

overflow:hidden;

background:#020817;

}

body{

position:fixed;

top:0;
left:50%;

width:100%;
max-width:430px;

transform:translateX(-50%);

margin:0;

}

.topbar,
.app,
.chat-page{

width:100%;
max-width:430px;

}

position:fixed;
left:50%;
transform:translateX(-50%);

body{

max-width:430px;

margin:0 auto;

position:relative;

}

/* TOPBAR */

.topbar{

width:100%;
height:64px;

padding:0 16px;

display:flex;
align-items:center;
justify-content:space-between;

background:linear-gradient(90deg,#001540,#0038a8,#001540);

border-bottom:1px solid rgba(255,255,255,.05);

}

.logo{

font-size:20px;
font-weight:900;

}

.admin-badge{

padding:7px 14px;

border-radius:30px;

background:#ffd000;
color:#000;

font-size:11px;
font-weight:900;

}

/* APP */

.app{

width:100%;
height:calc(100dvh - 64px);

overflow:hidden;

background:#061120;

}

/* USER LIST */

.user-list{

width:100%;
height:100%;

overflow-y:auto;

}

.user-row{

display:flex;
align-items:center;
gap:12px;

padding:14px 16px;

border-bottom:1px solid rgba(255,255,255,.04);

position:relative;

cursor:pointer;

transition:.2s;

}

.user-row:active{

background:#0b1f38;

}

.avatar{

width:54px;
height:54px;

border-radius:16px;

background:linear-gradient(135deg,#0038a8,#001540);

display:flex;
align-items:center;
justify-content:center;

font-size:23px;
font-weight:900;

flex-shrink:0;

}

.user-info{

flex:1;
min-width:0;

}

.user-name{

font-size:16px;
font-weight:800;

white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;

}

.user-preview{

margin-top:4px;

font-size:13px;

color:#8ea3b7;

white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;

}

.unread{

min-width:22px;
height:22px;

padding:0 6px;

border-radius:50px;

background:#ff3b30;

display:none;
align-items:center;
justify-content:center;

font-size:10px;
font-weight:900;

flex-shrink:0;

}

.unread.show{

display:flex;

}

/* CHAT PAGE */

.chat-page{

position:fixed;

top:0;
left:0;

width:100%;
max-width:430px;

height:100dvh;

background:#020817;

display:flex;
flex-direction:column;

transform:translateX(100%);

transition:.25s ease;

z-index:999;

}

.chat-page.show{

transform:translateX(0);

}

/* CHAT HEADER */

.chat-header{

height:70px;

padding:0 14px;

display:flex;
align-items:center;
gap:12px;

background:linear-gradient(90deg,#001540,#0038a8,#001540);

border-bottom:1px solid rgba(255,255,255,.05);

flex-shrink:0;

}

.back-btn{

width:40px;
height:40px;

border:none;
outline:none;

border-radius:14px;

background:rgba(255,255,255,.08);

color:#fff;

font-size:22px;

display:flex;
align-items:center;
justify-content:center;

flex-shrink:0;

cursor:pointer;

}

.chat-avatar{

width:48px;
height:48px;

border-radius:16px;

background:#ffd000;
color:#000;

display:flex;
align-items:center;
justify-content:center;

font-size:20px;
font-weight:900;

flex-shrink:0;

}

.chat-user{

font-size:16px;
font-weight:900;

}

.chat-phone{

margin-top:2px;

font-size:12px;

color:#d7d7d7;

}

.typing{

margin-top:2px;

font-size:11px;

color:#00ff88;

display:none;

}

/* MESSAGES */

.messages{

flex:1;

overflow-y:auto;

padding:14px;

display:flex;
flex-direction:column;
gap:12px;

background:#020817;

}

.msg{

max-width:78%;

padding:11px 13px;

border-radius:20px;

font-size:14px;

line-height:1.4;

word-break:break-word;

position:relative;

}

.msg.customer{

align-self:flex-start;

background:linear-gradient(135deg,#1b2638,#121c2b);

border-bottom-left-radius:8px;

}

.msg.admin{

align-self:flex-end;

background:linear-gradient(135deg,#ffd000,#ffb300);

color:#000;

border-bottom-right-radius:8px;

}

.msg img{

width:100%;
max-width:210px;

border-radius:14px;

display:block;

}

.msg-time{

margin-top:6px;

font-size:10px;

opacity:.7;

text-align:right;

}

.seen{

margin-top:3px;

font-size:10px;

opacity:.7;

text-align:right;

}

.delete-btn{

position:absolute;

top:-6px;
right:-6px;

width:20px;
height:20px;

border:none;

border-radius:50%;

background:#ff3b30;

color:#fff;

font-size:10px;
font-weight:900;

display:flex;
align-items:center;
justify-content:center;

cursor:pointer;

}

/* INPUT */

.input-area{

padding:12px;

display:flex;
align-items:center;
gap:10px;

background:#0b1220;

border-top:1px solid rgba(255,255,255,.05);

flex-shrink:0;

}

.input-btn{

width:50px;
height:50px;

border:none;

border-radius:16px;

display:flex;
align-items:center;
justify-content:center;

font-size:20px;

flex-shrink:0;

cursor:pointer;

}

.image-btn{

background:#1e293b;
color:#fff;

}

.send-btn{

background:linear-gradient(135deg,#ffd000,#ffb300);

color:#000;

font-weight:900;

}

.message-input{

flex:1;

height:50px;

border:none;
outline:none;

border-radius:16px;

background:#1e293b;

padding:0 14px;

font-size:15px;

color:#fff;

}

.message-input::placeholder{

color:#8ea3b7;

}

</style>
</head>

<body>

<div class="topbar">

<div class="logo">
⚡ Admin Panel
</div>

<div class="admin-badge">
ADMIN
</div>

</div>

<div class="app">

<div class="user-list" id="userList"></div>

</div>

<div class="chat-page" id="chatPage">

<div class="chat-header">

<button class="back-btn" id="backBtn">
‹
</button>

<div class="chat-avatar" id="chatAvatar">
?
</div>

<div>

<div class="chat-user" id="chatUser">
User
</div>

<div class="chat-phone" id="chatPhone">
Phone
</div>

<div class="typing" id="typingText">
Yazır...
</div>

</div>

</div>

<div class="messages" id="messages"></div>

<div class="input-area">

<input
type="file"
id="imageInput"
accept="image/*"
hidden
>

<button class="input-btn image-btn" id="imageBtn">
🖼️
</button>

<input
type="text"
id="messageInput"
class="message-input"
placeholder="Mesaj yaz..."
>

<button class="input-btn send-btn" id="sendBtn">
➜
</button>

</div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getDatabase,
ref,
push,
onValue,
onChildAdded,
update,
set,
remove
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

/* FIREBASE */

const firebaseConfig = {

apiKey:"AIzaSyBmtDa9fkBjd-J2tToJF_8CcPVZs3pJZsM",

authDomain:"batumi-kazino-5a748.firebaseapp.com",

databaseURL:"https://batumi-kazino-5a748-default-rtdb.firebaseio.com",

projectId:"batumi-kazino-5a748",

storageBucket:"batumi-kazino-5a748.firebasestorage.app",

messagingSenderId:"501153230995",

appId:"1:501153230995:web:8dac82ebf1904fc1881d66"

};

const app = initializeApp(firebaseConfig);

const db = getDatabase(app);

/* DOM */

const userList = document.getElementById("userList");
const chatPage = document.getElementById("chatPage");
const backBtn = document.getElementById("backBtn");
const chatAvatar = document.getElementById("chatAvatar");
const chatUser = document.getElementById("chatUser");
const chatPhone = document.getElementById("chatPhone");
const messages = document.getElementById("messages");
const imageBtn = document.getElementById("imageBtn");
const imageInput = document.getElementById("imageInput");
const messageInput = document.getElementById("messageInput");
const sendBtn = document.getElementById("sendBtn");
const typingText = document.getElementById("typingText");

/* STATE */

let activeUser = null;
const unreadMap = {};
const readState =
JSON.parse(
localStorage.getItem("readState") || "{}"
);
const userCache = {};

/* HELPERS */

function esc(text){

return String(text || "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;");

}

function timeFormat(ts){

return new Date(ts).toLocaleTimeString("az-AZ",{
hour:"2-digit",
minute:"2-digit"
});

}

function setUnread(userId,count){

unreadMap[userId] = count;

readState[userId] = count;

localStorage.setItem(
"readState",
JSON.stringify(readState)
);

const badge =
document.getElementById("badge_"+userId);

if(!badge) return;

badge.textContent =
count > 9 ? "9+" : count;

if(count > 0){

badge.classList.add("show");

}else{

badge.classList.remove("show");

}

}

/* OPEN CHAT */

function openChat(userId){

activeUser = userId;

chatPage.classList.add("show");

setUnread(userId,0);

delete readState[userId];

localStorage.setItem(
"readState",
JSON.stringify(readState)
);

const user = userCache[userId];

chatAvatar.textContent =
(user.username || "?")[0].toUpperCase();

chatUser.textContent =
user.username || "";

chatPhone.textContent =
user.phone || "";

const msgRef =
ref(db,"messages/"+userId);

onValue(msgRef,(snap)=>{

messages.innerHTML = "";

if(!snap.exists()) return;

const arr = [];

snap.forEach(child=>{

const data = child.val();

if(data.sender === "customer" && !data.seen){

update(
ref(db,"messages/"+userId+"/"+child.key),
{
seen:true
}
);

}
setUnread(userId,0);

delete readState[userId];

localStorage.setItem(
"readState",
JSON.stringify(readState)
);

arr.push({
key:child.key,
data:data
});

});

arr.sort((a,b)=>
(a.data.timestamp||0)-
(b.data.timestamp||0)
);

arr.forEach(item=>{

renderMessage(item.data,item.key);

});

});

const typingRef =
ref(db,"typing/"+userId);

onValue(typingRef,(snap)=>{

if(snap.val()){

typingText.style.display = "block";

}else{

typingText.style.display = "none";

}

});

}

/* RENDER MESSAGE */

function renderMessage(data,key){

const div = document.createElement("div");

div.className =
"msg " +
(data.sender === "admin"
? "admin"
: "customer");

let html = "";

if(data.image){

html =
`<img src="${data.image}">`;

}else{

html = esc(data.text);

}

div.innerHTML = `

${html}

<div class="msg-time">
${timeFormat(data.timestamp)}
</div>

${data.sender === "admin"
? `<div class="seen">
${data.seen ? "Oxundu ✓✓" : "Göndərildi ✓"}
</div>`
: ""}

<button class="delete-btn">
✕
</button>

`;

div.querySelector(".delete-btn").onclick =
async ()=>{

const ok =
confirm("Mesaj silinsin?");

if(!ok) return;

await remove(
ref(
db,
"messages/"+activeUser+"/"+key
)
);

};

messages.appendChild(div);

messages.scrollTop =
messages.scrollHeight;

}

/* USERS */

const usersRef = ref(db,"users");

onChildAdded(usersRef,(snap)=>{

const data = snap.val();

if(!data) return;

const userId =
data.customerId || snap.key;

userCache[userId] = data;

const row =
document.createElement("div");
unreadMap[userId] =
readState[userId] || 0;

row.className = "user-row";

row.innerHTML = `

<div class="avatar">
${(data.username || "?")[0].toUpperCase()}
</div>

<div class="user-info">

<div class="user-name">
${esc(data.username || "Unknown")}
</div>

<div class="user-preview"
id="preview_${userId}">
Mesaj yoxdur
</div>

</div>

<div class="unread"
id="badge_${userId}">
0
</div>

`;

row.onclick =
()=> openChat(userId);

userList.appendChild(row);
setUnread(
userId,
unreadMap[userId]
);

const msgRef =
ref(db,"messages/"+userId);

onChildAdded(msgRef,(msgSnap)=>{

const msg = msgSnap.val();

if(!msg) return;

const preview =
msg.text || "📷 Şəkil";

const previewEl =
document.getElementById(
"preview_"+userId
);

if(previewEl){

previewEl.textContent =
preview;

}

if(msg.sender === "customer"){

const isChatOpen =
activeUser === userId &&
chatPage.classList.contains("show");

if(isChatOpen){

return;

}

if(msg.seen){

return;

}

setUnread(
userId,
(unreadMap[userId] || 0) + 1
);

}

});

});

/* SEND MESSAGE */

function sendMessage(){

const text =
messageInput.value.trim();

if(!text || !activeUser) return;

push(
ref(db,"messages/"+activeUser),
{
sender:"admin",
text:text,
timestamp:Date.now(),
seen:false
}
);

messageInput.value = "";

}

sendBtn.onclick = sendMessage;

messageInput.addEventListener(
"keydown",
e=>{

if(e.key === "Enter"){

sendMessage();

}

}
);

/* TYPING */

let typingTimer;

messageInput.addEventListener(
"input",
()=>{

if(!activeUser) return;

set(
ref(db,"typing-admin/"+activeUser),
true
);

clearTimeout(typingTimer);

typingTimer = setTimeout(()=>{

set(
ref(db,"typing-admin/"+activeUser),
false
);

},1000);

}
);

/* IMAGE */

imageBtn.onclick = ()=>{

if(!activeUser) return;

imageInput.click();

};

imageInput.onchange = e=>{

const file = e.target.files[0];

if(!file) return;

const reader = new FileReader();

reader.onload = ()=>{

push(
ref(db,"messages/"+activeUser),
{
sender:"admin",
image:reader.result,
timestamp:Date.now(),
seen:false
}
);

};

reader.readAsDataURL(file);

};

/* BACK */

backBtn.onclick = ()=>{

chatPage.classList.remove("show");

};

</script>

</body>
</html>
