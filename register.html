<!DOCTYPE html>
<html lang="az">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Batumi VIP Register</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{

  background:
  linear-gradient(rgba(0,0,0,0.88),rgba(0,0,0,0.94)),
  url("https://images.unsplash.com/photo-1511512578047-dfb367046420?q=80&w=1200&auto=format&fit=crop");

  background-size:cover;
  background-position:center;
  background-attachment:fixed;

  min-height:100vh;

  display:flex;
  justify-content:center;
  align-items:flex-start;

  padding:20px;

  overflow-y:auto;
}

.auth-container{

  width:100%;
  max-width:430px;

  padding-bottom:40px;
}

.logo{

  text-align:center;

  color:#FFD700;

  font-size:56px;

  font-weight:900;

  letter-spacing:3px;

  margin-top:20px;
  margin-bottom:12px;

  text-shadow:
  0 0 20px rgba(255,215,0,0.6),
  0 0 40px rgba(255,215,0,0.4);
}

.subtitle{

  text-align:center;

  color:#d7d7d7;

  font-size:15px;

  margin-bottom:32px;
}

.vip-badge{

  position:fixed;

  top:20px;
  right:20px;

  background:#FFD700;

  color:black;

  padding:11px 20px;

  border-radius:999px;

  font-size:13px;

  font-weight:900;

  z-index:999;

  box-shadow:
  0 0 25px rgba(255,215,0,0.4);
}

.auth-card{

  background:
  rgba(10,10,10,0.96);

  border:
  1px solid rgba(255,215,0,0.12);

  border-radius:36px;

  padding:34px 24px;

  backdrop-filter:blur(14px);

  box-shadow:
  0 0 45px rgba(0,0,0,0.85);
}

.auth-title{

  color:white;

  font-size:46px;

  font-weight:900;

  margin-bottom:12px;
}

.auth-text{

  color:#8f8f8f;

  font-size:16px;

  line-height:1.7;

  margin-bottom:30px;
}

.input-box{
  margin-bottom:22px;
}

.input-box label{

  display:block;

  color:#FFD700;

  font-size:15px;

  font-weight:800;

  margin-bottom:10px;
}

.input-box input{

  width:100%;

  height:64px;

  border:none;

  outline:none;

  border-radius:22px;

  background:#1d1d1d;

  color:white;

  padding:0 20px;

  font-size:17px;

  transition:0.3s;
}

.input-box input:focus{

  border:1px solid #FFD700;

  box-shadow:
  0 0 20px rgba(255,215,0,0.25);
}

.input-box input::placeholder{
  color:#777;
}

.optional-text{

  color:#777;

  font-size:13px;

  margin-top:8px;
}

.password-box{
  position:relative;
}

.eye-btn{

  position:absolute;

  right:20px;
  top:50%;

  transform:translateY(-50%);

  color:#FFD700;

  cursor:pointer;

  font-size:22px;

  user-select:none;
}

.error-text{

  color:#ff4d4d;

  font-size:13px;

  margin-top:-10px;
  margin-bottom:15px;

  font-weight:700;
}

.register-btn{

  width:100%;

  height:64px;

  border:none;

  border-radius:22px;

  background:
  linear-gradient(135deg,#FFD700,#ffb300);

  color:black;

  font-size:21px;

  font-weight:900;

  cursor:pointer;

  transition:0.3s;

  margin-top:10px;
}

.register-btn:hover{

  transform:scale(1.02);

  box-shadow:
  0 0 28px rgba(255,215,0,0.45);
}

.switch-text{

  text-align:center;

  margin-top:26px;

  color:#999;

  font-size:15px;
}

.switch-text a{

  color:#FFD700;

  text-decoration:none;

  font-weight:900;
}

</style>

</head>

<body>

<div class="vip-badge">
  VIP BONUS
</div>

<div class="auth-container">

  <h1 class="logo">
    BATUMI
  </h1>

  <p class="subtitle">
    Premium Casino Mobile Experience
  </p>

  <div class="auth-card">

    <h2 class="auth-title">
      Qeydiyyat
    </h2>

    <p class="auth-text">
      Premium VIP hesab yarat və bütün xüsusi
      kampaniyalardan istifadə et.
    </p>

    <div class="input-box">

      <label>
        İstifadəçi Adı
      </label>

      <input
        type="text"
        id="registerUsername"
        placeholder="İstifadəçi adınızı daxil edin"
      >

    </div>

    <div class="input-box">

      <label>
        Telefon Nömrəsi
      </label>

      <input
        type="tel"
        id="registerPhone"
        placeholder="+994 50 365 67 89"
      >

    </div>

    <div class="input-box">

      <label>
        Email
      </label>

      <input
        type="email"
        id="registerEmail"
        placeholder="example@gmail.com"
      >

      <p class="optional-text">
        Email məcburi deyil
      </p>

    </div>

    <div class="input-box">

      <label>
        Şifrə
      </label>

      <div class="password-box">

        <input
          type="password"
          id="registerPassword"
          placeholder="Şifrə yaradın"
        >

        <span
          class="eye-btn"
          id="togglePassword"
        >
          👁
        </span>

      </div>

    </div>

    <div class="input-box">

      <label>
        Şifrəni Təkrar Yaz
      </label>

      <div class="password-box">

        <input
          type="password"
          id="registerPasswordRepeat"
          placeholder="Şifrəni yenidən yazın"
        >

        <span
          class="eye-btn"
          id="togglePasswordRepeat"
        >
          👁
        </span>

      </div>

    </div>

    <p
      class="error-text"
      id="errorText"
    ></p>

    <button
      id="registerBtn"
      class="register-btn"
    >
      QEYDİYYATDAN KEÇ
    </button>

    <p class="switch-text">

      Hesabın var?

      <a href="login.html">
        Daxil ol
      </a>

    </p>

  </div>

</div>

<script>

// INPUTLAR

const registerUsername =
document.getElementById("registerUsername");

const registerPhone =
document.getElementById("registerPhone");

const registerEmail =
document.getElementById("registerEmail");

const registerPassword =
document.getElementById("registerPassword");

const registerPasswordRepeat =
document.getElementById("registerPasswordRepeat");

const registerBtn =
document.getElementById("registerBtn");

const errorText =
document.getElementById("errorText");

// PASSWORD GOSTER

const togglePassword =
document.getElementById("togglePassword");

const togglePasswordRepeat =
document.getElementById("togglePasswordRepeat");

togglePassword.addEventListener("click", () => {

  if(registerPassword.type === "password"){

    registerPassword.type = "text";

  }else{

    registerPassword.type = "password";

  }

});

togglePasswordRepeat.addEventListener("click", () => {

  if(registerPasswordRepeat.type === "password"){

    registerPasswordRepeat.type = "text";

  }else{

    registerPasswordRepeat.type = "password";

  }

});

// QEYDIYYAT

registerBtn.addEventListener("click", () => {

  const username =
  registerUsername.value.trim();

  const phone =
  registerPhone.value.trim();

  const email =
  registerEmail.value.trim();

  const password =
  registerPassword.value;

  const repeatPassword =
  registerPasswordRepeat.value;

  errorText.innerText = "";

  if(
    username === "" ||
    phone === "" ||
    password === "" ||
    repeatPassword === ""
  ){

    errorText.innerText =
    "Bütün xanaları doldurun";

    return;
  }

  if(!phone.startsWith("+994")){

    errorText.innerText =
    "Telefon nömrəsi +994 ilə başlamalıdır";

    return;
  }

  if(password !== repeatPassword){

    errorText.innerText =
    "Şifrələr uyğun gəlmir";

    return;
  }

  localStorage.setItem("username", username);
  localStorage.setItem("phone", phone);
  localStorage.setItem("email", email);
  localStorage.setItem("password", password);

  alert("Qeydiyyat uğurla tamamlandı");

  window.location.href = "login.html";

});

</script>

</body>

</html>
