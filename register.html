<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Batumi VIP Register</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
body{background:linear-gradient(rgba(0,0,0,0.88),rgba(0,0,0,0.94)),url("https://images.unsplash.com/photo-1511512578047-dfb367046420?q=80&w=1200&auto=format&fit=crop");background-size:cover;background-position:center;background-attachment:fixed;min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:20px;overflow-y:auto;}
.auth-container{width:100%;max-width:430px;padding-bottom:40px;}
.logo{text-align:center;color:#FFD700;font-size:56px;font-weight:900;letter-spacing:3px;margin-top:20px;margin-bottom:12px;text-shadow:0 0 20px rgba(255,215,0,0.6),0 0 40px rgba(255,215,0,0.4);}
.subtitle{text-align:center;color:#d7d7d7;font-size:15px;margin-bottom:32px;}
.vip-badge{position:fixed;top:20px;right:20px;background:#FFD700;color:black;padding:11px 20px;border-radius:999px;font-size:13px;font-weight:900;z-index:999;box-shadow:0 0 25px rgba(255,215,0,0.4);}
.auth-card{background:rgba(10,10,10,0.96);border:1px solid rgba(255,215,0,0.12);border-radius:36px;padding:34px 24px;backdrop-filter:blur(14px);box-shadow:0 0 45px rgba(0,0,0,0.85);}
.auth-title{color:white;font-size:46px;font-weight:900;margin-bottom:12px;}
.auth-text{color:#8f8f8f;font-size:16px;line-height:1.7;margin-bottom:30px;}
.input-box{margin-bottom:22px;}
.input-box label{display:block;color:#FFD700;font-size:15px;font-weight:800;margin-bottom:10px;}
.input-box input{width:100%;height:64px;border:none;outline:none;border-radius:22px;background:#1d1d1d;color:white;padding:0 20px;font-size:17px;transition:0.3s;}
.input-box input:focus{border:1px solid #FFD700;box-shadow:0 0 20px rgba(255,215,0,0.25);}
.input-box input::placeholder{color:#777;}
.optional-text{color:#777;font-size:13px;margin-top:8px;}
.password-box{position:relative;}
.eye-btn{position:absolute;right:20px;top:50%;transform:translateY(-50%);color:#FFD700;cursor:pointer;font-size:22px;user-select:none;}
.error-text{color:#ff4d4d;font-size:13px;margin-top:-10px;margin-bottom:15px;font-weight:700;}
.register-btn{width:100%;height:64px;border:none;border-radius:22px;background:linear-gradient(135deg,#FFD700,#ffb300);color:black;font-size:21px;font-weight:900;cursor:pointer;transition:0.3s;margin-top:10px;}
.register-btn:hover{transform:scale(1.02);box-shadow:0 0 28px rgba(255,215,0,0.45);}
.register-btn:disabled{opacity:0.6;cursor:not-allowed;transform:none;}
.switch-text{text-align:center;margin-top:26px;color:#999;font-size:15px;}
.switch-text a{color:#FFD700;text-decoration:none;font-weight:900;}
</style>
</head>
<body>

<div class="vip-badge">VIP BONUS</div>

<div class="auth-container">
  <h1 class="logo">BATUMI</h1>
  <p class="subtitle">Premium Casino Mobile Experience</p>

  <div class="auth-card">
    <h2 class="auth-title">Qeydiyyat</h2>
    <p class="auth-text">Premium VIP hesab yarat və bütün xüsusi kampaniyalardan istifadə et.</p>

    <div class="input-box">
      <label>İstifadəçi Adı</label>
      <input type="text" id="registerUsername" placeholder="İstifadəçi adınızı daxil edin">
    </div>

    <div class="input-box">
      <label>Telefon Nömrəsi</label>
      <input type="tel" id="registerPhone" placeholder="+994 50 365 67 89">
    </div>

    <div class="input-box">
      <label>Email</label>
      <input type="email" id="registerEmail" placeholder="example@gmail.com">
      <p class="optional-text">Email məcburi deyil</p>
    </div>

    <div class="input-box">
      <label>Şifrə</label>
      <div class="password-box">
        <input type="password" id="registerPassword" placeholder="Şifrə yaradın">
        <span class="eye-btn" id="togglePassword">👁</span>
      </div>
    </div>

    <div class="input-box">
      <label>Şifrəni Təkrar Yaz</label>
      <div class="password-box">
        <input type="password" id="registerPasswordRepeat" placeholder="Şifrəni yenidən yazın">
        <span class="eye-btn" id="togglePasswordRepeat">👁</span>
      </div>
    </div>

    <p class="error-text" id="errorText"></p>

    <button id="registerBtn" class="register-btn">QEYDİYYATDAN KEÇ</button>

    <p class="switch-text">
      Hesabın var? <a href="login.html">Daxil ol</a>
    </p>
  </div>
</div>

<script type="module">
import { initializeApp }  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, get, set, child, query, orderByChild, equalTo }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

/* ── Firebase ── */
const firebaseConfig = {
  apiKey:            "AIzaSyBmtDa9fkBjd-J2tToJF_8CcPVZs3pJZsM",
  authDomain:        "batumi-kazino-5a748.firebaseapp.com",
  databaseURL:       "https://batumi-kazino-5a748-default-rtdb.firebaseio.com",
  projectId:         "batumi-kazino-5a748",
  storageBucket:     "batumi-kazino-5a748.firebasestorage.app",
  messagingSenderId: "501153230995",
  appId:             "1:501153230995:web:8dac82ebf1904fc1881d66"
};
const app = initializeApp(firebaseConfig);
const db  = getDatabase(app);

/* ── DOM ── */
const usernameInput = document.getElementById("registerUsername");
const phoneInput    = document.getElementById("registerPhone");
const emailInput    = document.getElementById("registerEmail");
const pwInput       = document.getElementById("registerPassword");
const pwRepeat      = document.getElementById("registerPasswordRepeat");
const registerBtn   = document.getElementById("registerBtn");
const errorText     = document.getElementById("errorText");

/* ── Helpers ── */
function showError(msg, success = false) {
  errorText.style.color = success ? "#4dff88" : "#ff4d4d";
  errorText.innerText   = msg;
}

function setLoading(on) {
  registerBtn.disabled    = on;
  registerBtn.textContent = on ? "Yüklənir..." : "QEYDİYYATDAN KEÇ";
}

/* ── Password toggles ── */
document.getElementById("togglePassword").addEventListener("click", () => {
  pwInput.type = pwInput.type === "password" ? "text" : "password";
});
document.getElementById("togglePasswordRepeat").addEventListener("click", () => {
  pwRepeat.type = pwRepeat.type === "password" ? "text" : "password";
});

/* ── Phone validation ── */
function validatePhone(raw) {
  const phone = raw.replace(/[\s\-()]/g, "");
  if (!phone.startsWith("+"))
    return { ok: false, msg: "Telefon + işarəsi ilə başlamalıdır (məs: +994501234567)" };

  const digits = phone.slice(1);
  if (!/^\d+$/.test(digits))
    return { ok: false, msg: "Telefon nömrəsində yalnız rəqəm olmalıdır" };

  if (phone.startsWith("+994")) {
    if (digits.length !== 12)
      return { ok: false, msg: "Azərbaycan nömrəsi +994 ilə başlayıb 12 rəqəm olmalıdır (məs: +994501234567)" };
    return { ok: true, normalized: phone };
  }

  if (digits.length < 7 || digits.length > 15)
    return { ok: false, msg: "Telefon nömrəsi düzgün formatda deyil" };

  return { ok: true, normalized: phone };
}

/* ── Check duplicate username across all users ── */
async function usernameExists(username) {
  const snap = await get(ref(db, "users"));
  if (!snap.exists()) return false;
  let found = false;
  snap.forEach(child => {
    const u = child.val();
    if (u && u.username && u.username.toLowerCase() === username.toLowerCase()) found = true;
  });
  return found;
}

/* ── Register ── */
registerBtn.addEventListener("click", async () => {
  showError("");

  const username = usernameInput.value.trim();
  const rawPhone = phoneInput.value.trim();
  const email    = emailInput.value.trim();
  const password = pwInput.value;
  const repeat   = pwRepeat.value;

  /* — Validation — */
  if (!username)            return showError("İstifadəçi adı daxil edin");
  if (username.length < 3)  return showError("İstifadəçi adı minimum 3 simvol olmalıdır");
  if (!rawPhone)            return showError("Telefon nömrəsi daxil edin");

  const phoneResult = validatePhone(rawPhone);
  if (!phoneResult.ok)      return showError(phoneResult.msg);

  if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))
    return showError("Email formatı yanlışdır");

  if (!password)            return showError("Şifrə daxil edin");
  if (password.length < 6)  return showError("Şifrə minimum 6 simvol olmalıdır");
  if (!repeat)              return showError("Şifrəni təkrar daxil edin");
  if (password !== repeat)  return showError("Şifrələr uyğun gəlmir");

  setLoading(true);

  try {
    /* — Check duplicate username — */
    if (await usernameExists(username)) {
      showError("Bu istifadəçi adı artıq mövcuddur");
      setLoading(false);
      return;
    }

    /* — Create unique customerId — */
    const customerId = crypto.randomUUID
      ? crypto.randomUUID()
      : "uid_" + Date.now() + "_" + Math.random().toString(36).slice(2);

    /* — Write to Firebase users/{customerId} — */
    await set(ref(db, "users/" + customerId), {
      username,
      phone:     phoneResult.normalized,
      email:     email || "",
      password,
      createdAt: Date.now()
    });

    /* — Persist to localStorage — */
    localStorage.setItem("customerId", customerId);
    localStorage.setItem("username",   username);
    localStorage.setItem("phone",      phoneResult.normalized);
    localStorage.setItem("email",      email || "");

    showError("Qeydiyyat uğurla tamamlandı", true);
    setTimeout(() => { window.location.href = "login.html"; }, 900);

  } catch (err) {
    console.error("Register error:", err);
    showError("Xəta baş verdi, yenidən cəhd edin");
  } finally {
    setLoading(false);
  }
});

/* ── Enter key ── */
[usernameInput, phoneInput, emailInput, pwInput, pwRepeat].forEach(el => {
  el.addEventListener("keydown", e => { if (e.key === "Enter") registerBtn.click(); });
});
</script>
</body>
</html>
