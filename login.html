<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Batumi VIP Login</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
body{background:linear-gradient(rgba(0,0,0,0.88),rgba(0,0,0,0.94)),url("https://images.unsplash.com/photo-1511512578047-dfb367046420?q=80&w=1200&auto=format&fit=crop");background-size:cover;background-position:center;background-attachment:fixed;min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:20px;overflow-y:auto;}
.auth-container{width:100%;max-width:430px;padding-bottom:40px;}
.logo{text-align:center;color:#FFD700;font-size:56px;font-weight:900;letter-spacing:3px;margin-top:20px;margin-bottom:12px;text-shadow:0 0 20px rgba(255,215,0,0.6),0 0 40px rgba(255,215,0,0.4);}
.subtitle{text-align:center;color:#d7d7d7;font-size:15px;margin-bottom:32px;}
.vip-badge{position:fixed;top:20px;right:20px;background:#FFD700;color:black;padding:11px 20px;border-radius:999px;font-size:13px;font-weight:900;z-index:999;box-shadow:0 0 25px rgba(255,215,0,0.4);}
.auth-card{background:rgba(10,10,10,0.96);border:1px solid rgba(255,215,0,0.12);border-radius:36px;padding:34px 24px;backdrop-filter:blur(14px);box-shadow:0 0 45px rgba(0,0,0,0.85);}
.auth-title{color:white;font-size:46px;font-weight:900;margin-bottom:12px;}
.auth-text{color:#8f8f8f;font-size:16px;line-height:1.7;margin-bottom:30px;}
.info-box{background:#151515;border:1px solid rgba(255,215,0,0.12);border-radius:22px;padding:18px;margin-bottom:25px;}
.info-box p{color:#FFD700;font-size:15px;line-height:1.7;font-weight:700;}
.input-box{margin-bottom:22px;}
.input-box label{display:block;color:#FFD700;font-size:15px;font-weight:800;margin-bottom:10px;}
.input-box input{width:100%;height:64px;border:none;outline:none;border-radius:22px;background:#1d1d1d;color:white;padding:0 20px;font-size:17px;transition:0.3s;}
.input-box input:focus{border:1px solid #FFD700;box-shadow:0 0 20px rgba(255,215,0,0.25);}
.input-box input::placeholder{color:#777;}
.password-box{position:relative;}
.eye-btn{position:absolute;right:20px;top:50%;transform:translateY(-50%);color:#FFD700;cursor:pointer;font-size:22px;user-select:none;}
.error-text{color:#ff4d4d;font-size:13px;margin-top:-10px;margin-bottom:15px;font-weight:700;}
.login-btn{width:100%;height:64px;border:none;border-radius:22px;background:linear-gradient(135deg,#FFD700,#ffb300);color:black;font-size:21px;font-weight:900;cursor:pointer;transition:0.3s;margin-top:10px;}
.login-btn:hover{transform:scale(1.02);box-shadow:0 0 28px rgba(255,215,0,0.45);}
.login-btn:disabled{opacity:0.6;cursor:not-allowed;transform:none;}
.switch-text{text-align:center;margin-top:26px;color:#999;font-size:15px;}
.switch-text a{color:#FFD700;text-decoration:none;font-weight:900;}
</style>
</head>
<body>

<div class="vip-badge">VIP CLUB</div>

<div class="auth-container">
  <h1 class="logo">BATUMI</h1>
  <p class="subtitle">Premium Casino Mobile Experience</p>

  <div class="auth-card">
    <h2 class="auth-title">Daxil Ol</h2>
    <p class="auth-text">Hesabınıza daxil olun və premium VIP xidmətlərdən istifadə edin.</p>

    <div class="info-box">
      <p>Qeydiyyat zamanı yaratdığınız istifadəçi adı və şifrəni daxil edin.</p>
    </div>

    <div class="input-box">
      <label>İstifadəçi Adı</label>
      <input type="text" id="loginUsername" placeholder="İstifadəçi adınızı daxil edin">
    </div>

    <div class="input-box">
      <label>Şifrə</label>
      <div class="password-box">
        <input type="password" id="loginPassword" placeholder="Şifrənizi daxil edin">
        <span class="eye-btn" id="togglePassword">👁</span>
      </div>
    </div>

    <p class="error-text" id="errorText"></p>

    <button id="loginBtn" class="login-btn">DAXİL OL</button>

    <p class="switch-text">
      Hesabınız yoxdur? <a href="register.html">Qeydiyyatdan keç</a>
    </p>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, get }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

/* ── Firebase ── */
const firebaseConfig = {
  apiKey:            "AIzaSyBmtDa9fkBjd-J2tToJF_8CcPVZs3pJZsM",
  authDomain:        "batumi-kazino-5a748.firebaseapp.com",
  databaseURL:       "https://batumi-kazino-5a748-default-rtdb.firebaseio.com",
  projectId:         "batumi-kazino-5a748",
  storageBucket:     "batumi-kazino-5a748.firebasestorage.app",
  messagingSenderId: "501153230995",
  appId:             "1:501153230995:web:8dac82ebf1904fc1881d66"
};
const app = initializeApp(firebaseConfig);
const db  = getDatabase(app);

/* ── DOM ── */
const usernameInput  = document.getElementById("loginUsername");
const passwordInput  = document.getElementById("loginPassword");
const loginBtn       = document.getElementById("loginBtn");
const errorText      = document.getElementById("errorText");
const togglePassword = document.getElementById("togglePassword");

/* ── Helpers ── */
function showError(msg, success = false) {
  errorText.style.color = success ? "#4dff88" : "#ff4d4d";
  errorText.innerText   = msg;
}

function setLoading(on) {
  loginBtn.disabled    = on;
  loginBtn.textContent = on ? "Yüklənir..." : "DAXİL OL";
}

/* ── Password toggle ── */
togglePassword.addEventListener("click", () => {
  passwordInput.type = passwordInput.type === "password" ? "text" : "password";
});

/* ── Login — queries Firebase users collection ── */
loginBtn.addEventListener("click", async () => {
  showError("");

  const username = usernameInput.value.trim();
  const password = passwordInput.value;

  if (!username || !password) {
    showError("Bütün xanaları doldurun");
    return;
  }

  setLoading(true);

  try {
    const snap = await get(ref(db, "users"));

    if (!snap.exists()) {
      showError("İstifadəçi adı və ya şifrə yanlışdır");
      setLoading(false);
      return;
    }

    let matchedId   = null;
    let matchedData = null;

    snap.forEach(child => {
      const u = child.val();
      if (
        u &&
        u.username &&
        u.username.toLowerCase() === username.toLowerCase() &&
        u.password === password
      ) {
        matchedId   = child.key;
        matchedData = u;
      }
    });

    if (!matchedId) {
      showError("İstifadəçi adı və ya şifrə yanlışdır");
      passwordInput.value = "";
      setLoading(false);
      return;
    }

    /* — Persist session to localStorage — */
    localStorage.setItem("customerId", matchedId);
    localStorage.setItem("username",   matchedData.username || "");
    localStorage.setItem("phone",      matchedData.phone    || "");
    localStorage.setItem("email",      matchedData.email    || "");

    showError("Giriş uğurludur", true);
    setTimeout(() => { window.location.href = "index.html"; }, 900);

  } catch (err) {
    console.error("Login error:", err);
    showError("Xəta baş verdi, yenidən cəhd edin");
    setLoading(false);
  }
});

/* ── Enter key ── */
[usernameInput, passwordInput].forEach(el => {
  el.addEventListener("keydown", e => { if (e.key === "Enter") loginBtn.click(); });
});
</script>
</body>
</html>
